services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      TRADING_MODE: paper
      ALLOW_LIVE_TRADING: "false"
      PAPER_LEDGER_PATH: /data/olympus_paper.sqlite3
    restart: unless-stopped
    volumes:
      - paper_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  paper_data:
