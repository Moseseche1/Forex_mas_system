name: Forex MAS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      # Step 4: Linting
      - name: Lint code
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      # Step 5: Run unit tests (both folders)
      - name: Run unit tests
        run: |
          echo "Running tests from original folder..."
          if [ -d "tests" ]; then pytest tests/ -v; else echo "No tests folder found"; fi

          echo "Running tests from new folder..."
          if [ -d "tests_new" ]; then pytest tests_new/ -v; else echo "No tests_new folder found"; fi

      # Step 6: Build Docker image (optional)
      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then docker build -t forex_mas_system .; else echo "No Dockerfile found"; fi

      # Step 7: Deploy placeholder
      - name: Deploy placeholder
        run: |
          echo "✅ Deployment stage reached — customize this step for your deployment method."
