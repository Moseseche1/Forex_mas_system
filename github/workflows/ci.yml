name: Forex MAS System – CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 🏁 Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐍 Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🔍 Linting for code quality
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      # 🧪 Run tests
      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov
          pytest --maxfail=1 --disable-warnings -q --cov=Services --cov=Models --cov-report=term-missing

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      # 🏁 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐳 Build Docker image
      - name: Build Docker image
        run: docker build -t forex_mas_system:latest .

      # ✅ (Optional) Push to Docker Hub or GHCR
      # Uncomment and configure if you want automated deployment
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
